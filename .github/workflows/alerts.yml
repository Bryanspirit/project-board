name: Email alerts

on:
  schedule:
    # Times are UTC. Ghana is UTC+0 year-round, so these are local times too.
    - cron: '0 6 * * 1-5'    # daily digest, weekday mornings at 06:00
    - cron: '0 7 * * 1'      # weekly summary, Monday at 07:00
    - cron: '*/15 * * * *'   # blocker sweep, every 15 minutes
    - cron: '5-59/15 * * * *'  # approval queue sweep, every 15 minutes (offset)
    - cron: '10-59/15 * * * *' # @mention digests, every 15 minutes (offset)
    - cron: '20 * * * *'     # meeting reminders, hourly
    - cron: '30 7 * * 1'     # admin roll-up, Monday at 07:30 (after the weekly)
  workflow_dispatch:
    inputs:
      mode:
        description: Which alert to run
        required: true
        default: daily
        type: choice
        options: [daily, weekly, blocked, access, mentions, meetings, admin-digest]
      dry_run:
        description: Print the emails instead of sending them
        type: boolean
        default: false

# Never let a slow run overlap the next scheduled one. Each mode gets its own
# group so the hourly meeting sweep cannot be held up behind the weekly roll-up,
# but two runs of the same mode still queue rather than race for the "notified"
# stamps.
concurrency:
  group: alerts-${{ github.event.schedule || inputs.mode || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pick alert mode
        id: mode
        # Maps each cron expression back to the alert it belongs to. A manual
        # run uses the dropdown instead.
        run: |
          case "${{ github.event.schedule }}" in
            "0 6 * * 1-5")      echo "value=daily"        >> "$GITHUB_OUTPUT" ;;
            "0 7 * * 1")        echo "value=weekly"       >> "$GITHUB_OUTPUT" ;;
            "*/15 * * * *")     echo "value=blocked"      >> "$GITHUB_OUTPUT" ;;
            "5-59/15 * * * *")  echo "value=access"       >> "$GITHUB_OUTPUT" ;;
            "10-59/15 * * * *") echo "value=mentions"     >> "$GITHUB_OUTPUT" ;;
            "20 * * * *")       echo "value=meetings"     >> "$GITHUB_OUTPUT" ;;
            "30 7 * * 1")       echo "value=admin-digest" >> "$GITHUB_OUTPUT" ;;
            *)                  echo "value=${{ inputs.mode || 'daily' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Send ${{ steps.mode.outputs.value }} alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.MAIL_FROM }}
          APP_URL: ${{ vars.APP_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/send-alerts.mjs ${{ steps.mode.outputs.value }}
